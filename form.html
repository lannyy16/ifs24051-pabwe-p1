<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Form pendaftaran akun">
    <title>Form Pendaftaran Akun</title>
</head>
<body>
    <nav aria-label="Navigasi utama">
        <a href="index.html">IMDb Top 3 Movies</a>&nbsp;|&nbsp;
        <a href="blog.html">Dev Blogs</a>&nbsp;|&nbsp;
        <a href="form.html">Form Pendaftaran Akun</a>&nbsp;|&nbsp;
        <a href="cv.html">Curriculum Vitae</a>
    </nav>

    <hr>

    <form action="#" method="post">
        <fieldset>
            <legend>Daftar Akun</legend>

            <p>
                <label for="nama">Nama Lengkap:</label><br>
                <input type="text" id="nama" name="nama" required>
            </p>

            <p>
                <span>Jenis Kelamin:</span><br>
                <input type="radio" id="laki-laki" name="jenis_kelamin" value="Laki-laki" required>
                <label for="laki-laki">Laki-laki</label>
                <input type="radio" id="perempuan" name="jenis_kelamin" value="Perempuan">
                <label for="perempuan">Perempuan</label>
            </p>

            <p>
                <label for="tempat-lahir">Tempat Lahir:</label><br>
                <input type="text" id="tempat-lahir" name="tempat_lahir" required>
            </p>

            <p>
                <label for="tanggal-lahir">Tanggal Lahir:</label><br>
                <input type="date" id="tanggal-lahir" name="tanggal_lahir" required>
            </p>

            <p>
                <label for="agama">Agama:</label><br>
                <select id="agama" name="agama" required>
                    <option value="Islam">Islam</option>
                    <option value="Katolik">Katolik</option>
                    <option value="Protestan">Protestan</option>
                    <option value="Hindu">Hindu</option>
                    <option value="Buddha">Buddha</option>
                    <option value="Konghucu">Konghucu</option>
                </select>
            </p>

            <p>
                <span>Hobi:</span><br>
                <input type="checkbox" id="membaca" name="hobi[]" value="Membaca">
                <label for="membaca">Membaca</label>
                <input type="checkbox" id="olahraga" name="hobi[]" value="Olahraga">
                <label for="olahraga">Olahraga</label>
                <input type="checkbox" id="musik" name="hobi[]" value="Musik">
                <label for="musik">Musik</label>
                <input type="checkbox" id="traveling" name="hobi[]" value="Traveling">
                <label for="traveling">Traveling</label>
            </p>

            <p>
                <label for="password">Password:</label><br>
                <input type="password" id="password" name="password" minlength="8" required>
            </p>

            <p>
                <input type="checkbox" id="persetujuan" name="persetujuan" value="setuju" required>
                <label for="persetujuan">Saya menyetujui syarat dan ketentuan</label>
            </p>

            <p>
                <input type="reset" value="Reset">
                <input type="submit" value="Submit">
            </p>
        </fieldset>
    </form>
</body>
</html>
